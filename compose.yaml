services:
  navigation:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        APP_VERSION: ${APP_VERSION:-1.0.7}
    image: ${NAVIGATION_IMAGE:-harbor-navigation:local}
    container_name: harbor-navigation
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      UPDATE_REPOSITORY: ${UPDATE_REPOSITORY:-Qiangii/QiangMacNav}
      UPDATE_IMAGE: ${UPDATE_IMAGE:-}
    volumes:
      - ${DATA_DIR:-navigation-data}:/data

volumes:
  navigation-data:
