name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: metadata
        shell: bash
        run: |
          version=$(tr -d '\r\n' < server/internal/buildinfo/version.txt)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.metadata.outputs.image }}:v${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.time }}
      - name: Publish stable release and digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg version "$VERSION" --arg digest "$DIGEST" '{version:$version,digest:$digest,protocol:1}' > update.json
          gh release create "$GITHUB_REF_NAME" update.json qiangmacnav-extension.zip --verify-tag --generate-notes --title "QiangMacNav $VERSION"
