name: Publish release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version
        id: metadata
        shell: bash
        run: |
          version=$(tr -d '\r\n' < server/internal/buildinfo/version.txt)
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ -n "$DOCKERHUB_USERNAME" ]]; then
            [[ "$DOCKERHUB_USERNAME" =~ ^[a-z0-9]+$ ]]
            echo "hub_version=docker.io/$DOCKERHUB_USERNAME/qiangmacnav:v$version" >> "$GITHUB_OUTPUT"
            echo "hub_latest=docker.io/$DOCKERHUB_USERNAME/qiangmacnav:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: browser-extension
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.metadata.outputs.image }}:v${{ steps.metadata.outputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
            ${{ steps.metadata.outputs.hub_version }}
            ${{ steps.metadata.outputs.hub_latest }}
          build-args: |
            APP_VERSION=${{ steps.metadata.outputs.version }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.metadata.outputs.time }}
      - name: Package website programs from the published image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            root=$(mktemp -d)
            docker pull --platform "linux/$arch" "$IMAGE@$DIGEST"
            cid=$(docker create --platform "linux/$arch" "$IMAGE@$DIGEST")
            docker cp "$cid:/app/navigation" "$root/navigation"
            docker cp "$cid:/app/dist" "$root/dist"
            docker rm -v "$cid"
            test -s "$root/dist/index.html"
            tar -C "$root" -czf "navigation-linux-$arch.tar.gz" navigation dist
          done
      - name: Publish stable release and digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.metadata.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          checksum() { sha256sum "navigation-linux-$1.tar.gz" | cut -d ' ' -f 1; }
          jq -n --arg version "$VERSION" --arg digest "$DIGEST" --arg amd "sha256:$(checksum amd64)" --arg arm "sha256:$(checksum arm64)" \
            '{version:$version,digest:$digest,protocol:1,bundles:{"linux-amd64":$amd,"linux-arm64":$arm}}' > update.json
          gh release create "$GITHUB_REF_NAME" update.json navigation-linux-{amd64,arm64}.tar.gz qiangmacnav-extension.zip --verify-tag --generate-notes --title "QiangMacNav $VERSION"
